name: Pages

# O site é o simulador: index.html, style.css e o JavaScript que o tsc gera em
# dist/. Como dist/ não vai para o git, quem publica tem que compilar, senão o
# site no ar seria uma cópia velha do código.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez, e sem cancelar o que já está no meio.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Não publica o que não passa: o tipo e os testes antes do build.
      - run: npm run check
      - run: npm test

      - run: npm run build

      # Só o que o navegador precisa. node_modules, tests e src ficam de fora.
      - name: Montar o site
        run: |
          mkdir _site
          cp index.html style.css _site/
          cp -r dist _site/dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
